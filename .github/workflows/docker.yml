name: CI-Docker

# A merge into main publishes a release when the version of pyproject.toml has
# no tag yet: image `latest` + `X.Y.Z`, tag `vX.Y.Z`, GitHub release with
# RELEASE_NOTES.md. A merge without a version change publishes nothing.
# Run by hand (workflow_dispatch) on a branch, it only builds and pushes
# `<branch>-latest` (`latest` for main), without tag nor release.

"on":
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve what to publish
        id: context
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "Tag v$VERSION already exists: nothing to publish."
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TITLE=$(head -1 RELEASE_NOTES.md | tr -d '\r')
            if [[ "$TITLE" != "# Budgie — $VERSION" ]]; then
              echo "::error::RELEASE_NOTES.md title is '$TITLE', expected '# Budgie — $VERSION'"
              exit 1
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.context.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.context.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.context.outputs.branch == 'main' }}
            type=raw,value=${{ steps.context.outputs.version }},enable=${{ steps.context.outputs.release == 'true' }}
            type=ref,event=branch,suffix=-latest,enable=${{ steps.context.outputs.branch != 'main' }}

      - name: Build and push
        if: steps.context.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        if: steps.context.outputs.build == 'true'
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker pull "$IMAGE"
          # Health check endpoint responds
          docker run -d --name budgie-test -p 18000:8000 \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e DATABASE_URL=sqlite+aiosqlite:////app/data/budgie.db \
            "$IMAGE"
          # Wait up to 30 s for the server to be ready (migrations can take a while)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18000/api/health 2>/dev/null | grep -q '"ok"'; then
              echo "Health check passed after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Health check timed out — container logs:"
              docker logs budgie-test
              docker stop budgie-test || true
              exit 1
            fi
            sleep 1
          done
          docker stop budgie-test

      - name: Tag and GitHub release
        if: steps.context.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.context.outputs.version }}
        run: |
          # 0.x versions stay pre-releases, as they always have been.
          PRERELEASE=""
          if [[ "$VERSION" == 0.* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "$VERSION" --notes-file RELEASE_NOTES.md $PRERELEASE
